<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyList" />
    <meta
      name="description"
      content="あとで読みたいURLを、iPhoneの共有シートからすばやく保存する個人用リスト"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>MyList</title>
  </head>
  <body>
    <div class="page-shell">
      <div class="sticky-navigation">
        <header class="app-header">
          <h1>MyList</h1>
          <div class="header-actions">
            <button class="icon-button" id="refresh-button" type="button" aria-label="一覧を更新">
              <span aria-hidden="true">↻</span>
            </button>
            <button class="icon-button" id="settings-button" type="button" aria-label="接続設定を開く">
              <span aria-hidden="true">•••</span>
            </button>
          </div>
        </header>

        <nav class="content-tabs" aria-label="表示する種類" role="tablist">
          <button class="content-tab" id="comic-tab" type="button" role="tab" aria-selected="true">
            漫画
          </button>
          <button class="content-tab" id="video-tab" type="button" role="tab" aria-selected="false">
            動画
          </button>
        </nav>
      </div>

      <main>
        <p id="status" class="status" role="status" aria-live="polite"></p>

        <section id="list" class="link-list" aria-label="保存したURL一覧"></section>

        <section id="empty-state" class="empty-state" hidden>
          <h2>まだ何もありません</h2>
        </section>
      </main>
    </div>

    <dialog id="settings-dialog" class="settings-dialog">
      <form id="settings-form" method="dialog">
        <div class="dialog-heading">
          <h2>Supabase接続設定</h2>
          <button class="close-button" id="close-settings" type="button" aria-label="設定を閉じる">×</button>
        </div>

        <label>
          <span>Project URL</span>
          <input
            id="supabase-url"
            name="supabaseUrl"
            type="url"
            inputmode="url"
            autocomplete="url"
            placeholder="https://xxxxxxxx.supabase.co"
            required
          />
        </label>

        <label>
          <span>Publishable key</span>
          <input
            id="publishable-key"
            name="publishableKey"
            type="password"
            autocomplete="off"
            placeholder="sb_publishable_..."
            required
          />
        </label>

        <label>
          <span>リストキー</span>
          <div class="input-with-actions">
            <input
              id="list-key"
              name="listKey"
              type="password"
              autocomplete="off"
              minlength="20"
              placeholder="20文字以上のランダムな文字列"
              required
            />
            <button id="reveal-key" type="button">表示</button>
          </div>
        </label>

        <div class="key-actions">
          <button id="generate-key" class="text-button" type="button">新しいキーを生成</button>
          <button id="copy-key" class="text-button" type="button">キーをコピー</button>
        </div>

        <p id="settings-error" class="form-error" role="alert"></p>

        <button class="primary-button" type="submit">保存して接続</button>
      </form>
    </dialog>

    <dialog id="editor-dialog" class="editor-dialog">
      <form id="editor-form">
        <header class="editor-header">
          <button class="editor-back-button" id="close-editor" type="button" aria-label="一覧に戻る">
            <span aria-hidden="true">‹</span>
          </button>
          <h2>作品を編集</h2>
          <button class="editor-save-button" type="submit">保存</button>
        </header>

        <div class="editor-body">
          <p id="editor-kind" class="editor-kind"></p>

          <label class="editor-field">
            <span>タイトル</span>
            <textarea
              id="editor-title"
              rows="4"
              maxlength="300"
              autocomplete="off"
              required
            ></textarea>
          </label>

          <section id="performer-editor" class="performer-editor" hidden>
            <div class="editor-section-heading">
              <h3>出演者</h3>
            </div>

            <div id="selected-performers" class="selected-performers"></div>

            <div class="performer-input-row">
              <input
                id="performer-input"
                type="text"
                maxlength="100"
                autocomplete="off"
                placeholder="出演者名を入力"
              />
              <button id="add-performer" type="button">追加</button>
            </div>

            <div id="suggestion-section" class="suggestion-section" hidden>
              <div id="performer-suggestions" class="performer-suggestions"></div>
            </div>
          </section>

          <p id="editor-error" class="form-error" role="alert"></p>

          <button id="delete-current" class="danger-button" type="button">この作品を削除</button>
        </div>
      </form>
    </dialog>

    <template id="link-item-template">
      <article class="link-card">
        <a class="link-main" target="_blank" rel="noopener noreferrer">
          <h2 class="link-title"></h2>
        </a>
        <button class="screen-reader-only edit-accessible" type="button">編集</button>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
